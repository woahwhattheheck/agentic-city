name: Agent 83 public profile patch

on:
  push:
    branches:
      - sol56/agent83-public-profile-20261005

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor == 'woahwhattheheck'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: sol56/agent83-public-profile-20261005
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch the public profile consumer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/agents/[id]/page.tsx")
          text = path.read_text()
          replacements = [
              (
                  'absoluteUrl(`/api/agents/${id}`)',
                  'absoluteUrl(`/api/agents/${id}?view=public`)',
              ),
              (
                  'absoluteUrl(`/api/agents/${id}/health`)',
                  'absoluteUrl(`/api/agents/${id}/health?view=public`)',
              ),
              ('  let currentTask = "No active task"\n', ''),
              ('    currentTask = healthData.health?.currentTask || "No active task"\n', ''),
              ('      currentTask = health.currentTask || "No active task"\n', ''),
              ('      currentTask = localAgent.currentTask || "No active task"\n', ''),
              (
                  '              {/* Current Task */}\n'
                  '              <div className="mt-1 font-mono text-sm text-slate-300">\n'
                  '                <span className="text-slate-500">Current Task:</span> <span className="text-cyan-300 font-semibold">{currentTask}</span>\n'
                  '              </div>\n',
                  '',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence, found {count}: {old!r}")
              text = text.replace(old, new)

          path.write_text(text)
          PY

          grep -Fq '/api/agents/${id}?view=public' 'app/agents/[id]/page.tsx'
          grep -Fq '/api/agents/${id}/health?view=public' 'app/agents/[id]/page.tsx'
          if grep -Fq 'Current Task:' 'app/agents/[id]/page.tsx'; then
            echo 'public profile still renders task text' >&2
            exit 1
          fi
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run focused profile and compatibility tests
        run: npx vitest run __tests__/agents/public-profile.test.ts __tests__/api/agents/registry.test.ts __tests__/api/agents/health.test.ts

      - name: Commit verified page patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent83-public-profile.yml
          git add 'app/agents/[id]/page.tsx'
          git diff --cached --check
          git commit -m "fix(profiles): consume public data views"
          git push origin HEAD:sol56/agent83-public-profile-20261005
